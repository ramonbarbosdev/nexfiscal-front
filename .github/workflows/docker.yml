name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTAINER_PORT: 80
  DOCKER_NETWORK: network-nexfiscal

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.vars.outputs.ambiente }}
      image_name: ${{ steps.vars.outputs.image_name }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      latest_tag: ${{ steps.vars.outputs.latest_tag }}
      container_name: ${{ steps.vars.outputs.container_name }}
      host_port: ${{ steps.vars.outputs.host_port }}
    steps:
      - name: Resolve environment
        id: vars
        shell: bash
        run: |
          IMAGE_NAME="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "ambiente=prod" >> "$GITHUB_OUTPUT"
          echo "image_tag=prod-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=prod-latest" >> "$GITHUB_OUTPUT"
          echo "container_name=nexfiscal-front-prod" >> "$GITHUB_OUTPUT"
          echo "host_port=5174" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.ambiente }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Clean Docker cache
        run: |
          docker buildx prune -af || true
          docker system prune -af || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          provenance: false
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.latest_tag }}

  deploy:
    needs:
      - prepare
      - build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.ambiente }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.image_tag }}"
            CONTAINER_NAME="${{ needs.prepare.outputs.container_name }}"
            HOST_PORT="${{ needs.prepare.outputs.host_port }}"
            CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
            DOCKER_NETWORK="${{ env.DOCKER_NETWORK }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

            if ! docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1; then
              docker network create "$DOCKER_NETWORK"
            fi

            docker system prune -f || true
            docker builder prune -f || true

            docker pull "$IMAGE" || {
              echo "Primeiro docker pull falhou. Limpando cache e tentando novamente..."
              docker system prune -a -f || true
              systemctl restart docker || true
              sleep 5
              docker pull "$IMAGE"
            }

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --network "$DOCKER_NETWORK" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE"

            docker image prune -a -f

            echo "Deploy prod finished successfully"
